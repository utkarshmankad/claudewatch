<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Token Watcher</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
<div id="app">

  <!-- ── Header ── -->
  <header>
    <div class="header-left">
      <svg class="logo" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="tw-g" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#6366f1"/>
            <stop offset="100%" stop-color="#a855f7"/>
          </linearGradient>
        </defs>
        <rect width="20" height="20" rx="5" fill="url(#tw-g)"/>
        <text x="10" y="14.5" font-family="monospace" font-size="9" font-weight="900"
              fill="#fff" text-anchor="middle">TW</text>
      </svg>
      <span class="brand">Token Watcher</span>
      <span class="version" id="version"></span>
    </div>
    <span class="last-update" id="last-update" title="Last token captured">—</span>
  </header>

  <!-- ── Alert banner ── -->
  <div class="alert alert-warn" id="alert" hidden>
    <svg width="13" height="13" viewBox="0 0 16 16" fill="none" aria-hidden="true">
      <path d="M8 1L15 14H1L8 1Z" stroke="#f59e0b" stroke-width="1.5" fill="none"/>
      <path d="M8 6v4M8 11.5v.5" stroke="#f59e0b" stroke-width="1.5" stroke-linecap="round"/>
    </svg>
    <span id="alert-text"></span>
  </div>

  <!-- ── Empty state ── -->
  <div class="empty-state" id="empty-state" hidden>
    <div class="empty-icon">◎</div>
    <p class="empty-title">Waiting for data…</p>
    <p class="empty-hint">Open a signed-in Claude, ChatGPT, or Gemini tab to collect usage automatically</p>
    <div class="empty-links">
      <button class="btn btn-primary btn-sm" id="btn-open-claude">Open Claude →</button>
      <button class="btn btn-ghost btn-sm" id="btn-open-chatgpt">ChatGPT →</button>
      <button class="btn btn-ghost btn-sm" id="btn-open-gemini">Gemini →</button>
    </div>
  </div>

  <!-- ── Main content ── -->
  <div id="main-content" hidden>

    <!-- ── Site breakdown ── -->
    <section class="section site-section">
      <div class="section-label">Sources</div>
      <div class="site-list" id="site-list"></div>
    </section>

    <div class="divider"></div>

    <!-- ── Dual gauge section (Claude window) ── -->
    <section class="section gauges-section">
      <div class="usage-heading">
        <div class="section-label" id="provider-window-label">Usage Window</div>
        <select id="account-select" class="account-select" aria-label="Provider account" hidden></select>
      </div>
      <div class="provider-health" id="provider-health" hidden></div>
      <div class="gauge-cards">

        <div class="gauge-card">
          <div class="gc-label" id="label-5h">5-Hour</div>
          <div class="gc-tokens" id="tokens-5h">Account quota</div>
          <div class="gc-bar-wrap">
            <div class="gc-bar">
              <div class="gc-fill" id="fill-5h"></div>
            </div>
            <span class="gc-pct" id="pct-5h">—</span>
          </div>
        </div>

        <div class="gauge-divider"></div>

        <div class="gauge-card">
          <div class="gc-label" id="label-7d">7-Day Rolling</div>
          <div class="gc-tokens" id="tokens-7d">Account quota</div>
          <div class="gc-bar-wrap">
            <div class="gc-bar">
              <div class="gc-fill" id="fill-7d"></div>
            </div>
            <span class="gc-pct" id="pct-7d">—</span>
          </div>
        </div>

      </div>
    </section>

    <!-- ── Reset countdown strip ── -->
    <div class="reset-strip">
      <div class="reset-item">
        <span class="reset-label" id="reset-label-5h">5h resets in</span>
        <span class="reset-clock" id="countdown-5h">—</span>
      </div>
      <div class="reset-sep"></div>
      <div class="reset-item">
        <span class="reset-label" id="reset-label-7d">7d resets in</span>
        <span class="reset-clock" id="countdown-7d">—</span>
      </div>
    </div>

    <div class="divider"></div>

    <!-- ── Token history chart ── -->
    <section class="section chart-section">
      <div class="chart-header">
        <span class="section-label">Token History</span>
        <div class="tab-group">
          <button class="tab active" id="tab-5h" data-win="5h">5h</button>
          <button class="tab"        id="tab-7d" data-win="7d">7d</button>
        </div>
      </div>
      <div class="chart-wrap">
        <svg id="sparkline" width="100%" height="52" preserveAspectRatio="none">
          <text id="chart-empty-msg" x="50%" y="50%" text-anchor="middle"
                dominant-baseline="middle" class="chart-empty">No data yet</text>
        </svg>
      </div>
    </section>

    <div class="divider"></div>

    <!-- ── Plan comparison ── -->
    <section class="section table-section" id="claude-plan-section">
      <div class="section-label">Claude Plan Comparison</div>
      <table class="plan-table">
        <thead>
          <tr>
            <th>Plan</th>
            <th title="% of 5-hour window limit used">5h %</th>
            <th title="% of 7-day rolling limit used">7d %</th>
          </tr>
        </thead>
        <tbody id="plan-tbody">
          <tr class="skeleton"><td colspan="3">Loading…</td></tr>
        </tbody>
      </table>
    </section>

  </div>

  <!-- ── Footer ── -->
  <footer>
    <div class="footer-left">
      <span class="plan-pill" id="plan-pill">—</span>
    </div>
    <div class="footer-right">
      <button class="footer-btn" id="btn-settings">Settings ⚙</button>
    </div>
  </footer>

</div>
<script src="popup.js"></script>
</body>
</html>
