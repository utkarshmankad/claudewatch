<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Token Watcher Settings</title>
  <link rel="stylesheet" href="settings.css" />
</head>
<body>
  <div id="app">

    <!-- ── Page header ── -->
    <header>
      <div class="header-inner">
        <div class="header-left">
          <svg class="logo-mark" viewBox="0 0 22 22" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <defs>
              <linearGradient id="tw-sg" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#6366f1"/>
                <stop offset="100%" stop-color="#a855f7"/>
              </linearGradient>
            </defs>
            <rect width="22" height="22" rx="5" fill="url(#tw-sg)"/>
            <text x="11" y="16" font-family="monospace" font-size="10" font-weight="900"
                  fill="#fff" text-anchor="middle">TW</text>
          </svg>
          <div>
            <h1>Token Watcher</h1>
            <p class="header-sub">Extension Settings</p>
          </div>
        </div>
        <span class="version" id="version"></span>
      </div>
    </header>

    <!-- ── Main form ── -->
    <main>
      <form id="settings-form" novalidate>

        <!-- NOTIFICATIONS -->
        <section class="card">
          <h2 class="card-title">Notifications</h2>

          <label class="toggle-row" for="alerts-enabled">
            <span class="toggle-text">
              <span class="toggle-label">Enable usage alerts</span>
              <span class="toggle-hint">Show desktop notifications when thresholds are crossed</span>
            </span>
            <span class="switch">
              <input type="checkbox" id="alerts-enabled" name="alertsEnabled" />
              <span class="switch-track"></span>
            </span>
          </label>
        </section>

        <!-- ALERT THRESHOLDS -->
        <section class="card" id="thresholds-card">
          <h2 class="card-title">Alert Thresholds</h2>
          <p class="card-hint">Each threshold fires once per session window, then re-arms when the window resets.</p>

          <div class="threshold-list">
            <label class="checkbox-row" for="t-80">
              <input type="checkbox" id="t-80" name="threshold" value="80" />
              <span class="checkbox-custom"></span>
              <span class="checkbox-body">
                <span class="threshold-pct green">80%</span>
                <span class="threshold-desc">Approaching limit — good time to wrap up</span>
              </span>
            </label>

            <label class="checkbox-row" for="t-90">
              <input type="checkbox" id="t-90" name="threshold" value="90" />
              <span class="checkbox-custom"></span>
              <span class="checkbox-body">
                <span class="threshold-pct amber">90%</span>
                <span class="threshold-desc">High usage — save your work</span>
              </span>
            </label>

            <label class="checkbox-row" for="t-95">
              <input type="checkbox" id="t-95" name="threshold" value="95" />
              <span class="checkbox-custom"></span>
              <span class="checkbox-body">
                <span class="threshold-pct red">95%</span>
                <span class="threshold-desc">Critical — session almost exhausted</span>
              </span>
            </label>
          </div>
        </section>

        <section class="card">
          <h2 class="card-title">Privacy &amp; analytics</h2>
          <label class="toggle-row" for="in-page-gauges">
            <span class="toggle-text"><span class="toggle-label">In-page usage gauge</span><span class="toggle-hint">Show the compact quota gauge on supported provider pages</span></span>
            <span class="switch"><input type="checkbox" id="in-page-gauges" /><span class="switch-track"></span></span>
          </label>
          <label class="toggle-row spaced" for="core-sync-enabled">
            <span class="toggle-text"><span class="toggle-label">Share usage with local ClaudeWatch Core</span><span class="toggle-hint">Opt in to sending metadata-only events to localhost:7734. Prompts and responses are never sent.</span></span>
            <span class="switch"><input type="checkbox" id="core-sync-enabled" /><span class="switch-track"></span></span>
          </label>
          <div class="identity-grid">
            <label>User label<input type="text" id="analytics-user-id" maxlength="128" placeholder="Optional pseudonymous user ID" /></label>
            <label>Team label<input type="text" id="analytics-team-id" maxlength="128" placeholder="Optional team ID" /></label>
          </div>
        </section>

        <!-- ABOUT -->
        <section class="card card-about">
          <h2 class="card-title">About</h2>
          <dl class="about-grid">
            <dt>Version</dt>      <dd id="about-version">—</dd>
            <dt>Extension ID</dt> <dd id="about-ext-id" class="mono truncate">—</dd>
          </dl>
        </section>

        <!-- Actions -->
        <div class="actions">
          <button type="submit" class="btn btn-primary" id="btn-save">Save Settings</button>
          <button type="button" class="btn btn-ghost"   id="btn-reset">Reset to defaults</button>
          <span class="save-confirm" id="save-confirm" aria-live="polite"></span>
        </div>

      </form>
    </main>

  </div>
  <script src="settings.js"></script>
</body>
</html>
