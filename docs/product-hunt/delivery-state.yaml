heartbeat:
  name: Token Watcher Delivery Heartbeat
  requested_schedule: hourly
  status: not_created
  blocker: >-
    No automation scheduling tool is exposed; Computer Use explicitly disallows the Codex app. No authoritative
    account-usage availability API is exposed.
  notified_at: '2026-10-10T09:43:42.142Z'
  next_action: >-
    Create the hourly heartbeat through an authorized Codex automation interface; do not infer account usage
    availability from goal token accounting.
  rules:
    - Inspect active Goal, authoritative usage availability, durable state, Git, existing PR and CI.
    - If usage is unavailable or cannot be verified, make no repository/GitHub changes and stay quiet.
    - Resume recorded next action only for an active incomplete Goal with usage available.
    - When waiting for CI, inspect the existing PR once; never create empty commits or duplicate PRs.
    - Record blockers needing approval, credentials, or decisions and notify once per distinct blocker.
    - Stay quiet when nothing meaningful changes.
    - Notify once on Goal completion; no further implementation until a new Goal.
