name: Browser soak

# Runs the real extension in a real Chromium on GitHub-hosted runners against a fixture provider with injected faults
# (scripts/soak/). A pull request that touches the soak code runs one short leg; a manual run chains 5.5 hour legs
# (the hosted-runner job limit is 6 hours), each reopening the previous leg's browser profile. No provider account or
# credential is used or needed.
on:
  workflow_dispatch:
    inputs:
      total_hours:
        description: 'Total soak length in hours (72 for the Phase 6 release candidate)'
        default: '72'
      fault_every_minutes:
        description: 'Average minutes between injected faults'
        default: '12'
  pull_request:
    paths:
      - 'scripts/soak/**'
      - '.github/workflows/soak.yml'
      - 'claudewatch-extension/refresh-policy.js'
      - 'claudewatch-extension/background.js'

permissions:
  contents: read

concurrency:
  group: soak-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      legs: ${{ steps.legs.outputs.legs }}
      total_minutes: ${{ steps.legs.outputs.total_minutes }}
      leg_minutes: ${{ steps.legs.outputs.leg_minutes }}
      fault_every: ${{ steps.legs.outputs.fault_every }}
    steps:
      - id: legs
        env:
          EVENT: ${{ github.event_name }}
          TOTAL_HOURS: ${{ inputs.total_hours }}
          FAULT_EVERY: ${{ inputs.fault_every_minutes }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            [[ "$TOTAL_HOURS" =~ ^[0-9]+$ && "$FAULT_EVERY" =~ ^[0-9]+$ ]] || { echo "inputs must be whole numbers"; exit 1; }
            total=$(( TOTAL_HOURS * 60 )); leg=330; every="$FAULT_EVERY"
          else
            total=20; leg=20; every=3          # pull request: one short leg that proves the harness works in the cloud
          fi
          n=$(( (total + leg - 1) / leg ))
          legs=$(for i in $(seq 0 $((n - 1))); do printf '{"leg":%d,"prev":%d},' "$i" "$((i - 1))"; done)
          echo "legs=[${legs%,}]" >> "$GITHUB_OUTPUT"
          echo "total_minutes=${total}" >> "$GITHUB_OUTPUT"
          echo "leg_minutes=${leg}" >> "$GITHUB_OUTPUT"
          echo "fault_every=${every}" >> "$GITHUB_OUTPUT"

  soak:
    name: Soak leg ${{ matrix.leg.leg }}
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 355
    strategy:
      fail-fast: false
      max-parallel: 1            # legs run one after another, in order
      matrix:
        leg: ${{ fromJSON(needs.plan.outputs.legs) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Restore the previous leg's browser profile
        if: ${{ matrix.leg.leg > 0 }}
        uses: actions/download-artifact@v7
        with:
          name: soak-profile-${{ matrix.leg.prev }}
          path: .soak-profile
      - name: Run the leg
        env:
          SOAK_MINUTES: ${{ needs.plan.outputs.leg_minutes }}
          SOAK_TOTAL_MINUTES: ${{ needs.plan.outputs.total_minutes }}
          LEG: ${{ matrix.leg.leg }}
          SOAK_FAULT_EVERY_MIN: ${{ needs.plan.outputs.fault_every }}
          SOAK_PROFILE: .soak-profile
          SOAK_OUT: soak-out
        run: |
          export SOAK_OFFSET_MINUTES=$(( LEG * SOAK_MINUTES ))
          rm -f .soak-profile/Singleton* 2>/dev/null || true
          xvfb-run -a node scripts/soak/browser-soak.mjs
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: soak-leg-${{ matrix.leg.leg }}
          path: soak-out/
          retention-days: 30
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: soak-profile-${{ matrix.leg.leg }}
          path: .soak-profile/
          retention-days: 3

  report:
    name: Soak report
    needs: soak
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@v7
        with:
          pattern: soak-leg-*
          path: legs
      - name: Aggregate
        run: |
          node scripts/soak/report.mjs soak-report.md legs/*/ | tee -a "$GITHUB_STEP_SUMMARY" > /dev/null
      - uses: actions/upload-artifact@v7
        with:
          name: soak-report
          path: |
            soak-report.md
            soak-report.json
          retention-days: 90
